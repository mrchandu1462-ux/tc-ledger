name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-python:
    name: Python Test Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run Pytest Suite
        run: uv run pytest

      - name: Validate Frozen RFC 6962 Vectors (Human & JSON)
        run: |
          uv run tc-ledger vectors
          uv run tc-ledger vectors --json

      - name: Run End-to-End Demo (Read-Only Check)
        run: uv run python examples/demo.py

      - name: Verify Shipped Commitment & Proof Artifacts Directly
        run: |
          uv run tc-ledger verify examples/synthetic_export.jsonl --room demo-room --json
          uv run tc-ledger verify-artifact examples/synthetic_export.jsonl examples/commitment.json --expected-room demo-room --expected-root 0373cfc78e0b17cd733fd38318af51e119ef366954b0a0fbcba251ef15b066b9 --expected-generation 1 --json
          uv run tc-ledger verify-proof examples/proof_leaf1.json --record examples/record_1.bin --expected-root 0373cfc78e0b17cd733fd38318af51e119ef366954b0a0fbcba251ef15b066b9 --expected-room demo-room --expected-generation 1 --json

      - name: Assert Working Tree Cleanliness
        run: git diff --exit-code

  test-evm:
    name: EVM Rail Tests (Foundry & TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tclk-rail-evm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tc-ledger package
        run: pip install -e ..

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tclk-rail-evm/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Foundry Dependencies
        run: forge install foundry-rs/forge-std --no-git

      - name: Run Foundry Contract Tests
        run: forge test

      - name: Run TypeScript Tests
        run: npm test

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Assert Clean Working Tree
        run: git diff --exit-code
